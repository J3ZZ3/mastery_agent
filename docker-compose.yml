services:
  postgres:
    image: postgres:16-alpine
    container_name: mastery-pg
    environment:
      POSTGRES_USER: mastery
      POSTGRES_PASSWORD: mastery
      POSTGRES_DB: mastery
    ports:
      - "5433:5432"
    volumes:
      - mastery-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastery -d mastery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mastery-pg-data:
